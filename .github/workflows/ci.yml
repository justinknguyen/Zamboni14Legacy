name: CI

on:
  push:
  pull_request:

jobs:
  # ── .NET build ──────────────────────────────────────────────────────────────
  dotnet-build:
    name: .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Clone the sibling repos that Zamboni14Legacy.csproj references via
      # ProjectReference (../BlazeSDK/... and ../PSN/...).
      - name: Clone BlazeSDK
        run: |
          git clone --branch nhl14legacy-compatability --depth 1 \
            https://github.com/ZamboniDevelopment/BlazeSDK.git ../BlazeSDK

      - name: Clone PSN
        run: |
          git clone --branch master --depth 1 \
            https://github.com/Aim4kill/PSN.git ../PSN

      - uses: actions/setup-dotnet@3951f0dfe7a07e2313d42be71b35f5aeb6a18e9e # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: |
          dotnet build Zamboni14Legacy.csproj -c Release \
            -p:NoWarn="CS0649;CS0108;CS8600;CS8603;CS8604;CS8618;CS8625;CS8765;SYSLIB0022;SYSLIB0023" \
            /warnaserror:CS0246,CS0103,CS1061

  # ── Docker build (game server) ───────────────────────────────────────────────
  docker-build-zamboni:
    name: Docker build — game server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Zamboni14 image
        run: docker build -f docker/Dockerfile -t zamboni14:ci .

  # ── Docker build (QoS server) ───────────────────────────────────────────────
  docker-build-qos:
    name: Docker build — QoS server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build QoS image
        run: docker build -f docker/Dockerfile.qos -t zamboni-qos:ci .
